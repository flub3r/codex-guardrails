[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "low"
# Keep the primary model user-selected. Generic workers start efficient;
# named agents escalate only for a concrete need. Three threads is a safety
# ceiling; single-agent work is the default.
